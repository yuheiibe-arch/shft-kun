<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: 'Helvetica Neue', Arial, sans-serif; padding: 15px; color: #333; }
      h3 { margin-top: 0; font-size: 16px; border-bottom: 2px solid #4a86e8; padding-bottom: 5px; }
      .form-group { margin-bottom: 15px; }
      select { padding: 5px; font-size: 14px; width: 100%; margin-bottom: 10px; }
      .checkbox-list { max-height: 250px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; border-radius: 4px; background: #f9f9f9; }
      .checkbox-item { margin-bottom: 5px; display: flex; align-items: center; }
      .checkbox-item input { margin-right: 8px; }
      .badge-created { font-size: 10px; background: #ea4335; color: white; padding: 2px 6px; border-radius: 10px; margin-left: 10px; }
      .btn-primary { background: #4a86e8; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 14px; font-weight: bold; }
      .btn-primary:disabled { background: #cccccc; cursor: not-allowed; }
      .btn-small { background: #f1f3f4; border: 1px solid #dadce0; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-right: 5px; }
      .btn-small:hover { background: #e8eaed; }
      .list-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 5px; }
      
      #progressContainer { display: none; margin-top: 15px; padding: 10px; background: #e8f0fe; border: 1px solid #c2e0ff; border-radius: 4px; font-size: 13px; }
      #progressStatus { margin-top: 10px; font-weight: bold; color: #4a86e8; }
      #progressBarBg { width: 100%; background-color: #ffffff; border-radius: 4px; border: 1px solid #ccc; margin-top: 5px; height: 16px; position: relative; overflow: hidden; }
      #progressBarFill { width: 0%; height: 100%; background-color: #4a86e8; transition: width 0.5s; }
      #progressDetail { font-size: 11px; color: #666; margin-top: 5px; text-align: right; }
    </style>
  </head>
  <body>
    <h3>1. 作成する年度・期間を選択</h3>
    <div class="form-group">
      <select id="yearSelect" onchange="loadLocations()">
        <option value="">年度を読込中...</option>
      </select>
      
      <select id="termSelect" onchange="loadLocations()">
        <option value="">▼ 期間を選択</option>
        <option value="通年">通年（4月〜翌3月）</option>
        <option value="上期">上期（4月〜9月）</option>
        <option value="下期">下期（10月〜翌3月）</option>
      </select>
    </div>

    <div class="list-header">
      <h3>2. 対象拠点を選択</h3>
      <div id="selectionButtons" style="display: none;">
        <button class="btn-small" onclick="selectAll(true)">全選択</button>
        <button class="btn-small" onclick="selectAll(false)">全選択解除</button>
      </div>
    </div>
    
    <div class="form-group">
      <div id="locationList" class="checkbox-list">
        <p style="color: #888; font-size: 12px; margin: 0;">年度と期間を選択すると、その期間内に開院している拠点が表示されます。</p>
      </div>
    </div>

    <button id="submitBtn" class="btn-primary" onclick="startBatchProcess()" disabled>シフト表を裏側で作成する</button>
    
    <div id="progressContainer">
      <div>処理を予約しました！この画面を閉じても裏側で処理は続行されます。</div>
      <div id="progressStatus">準備中...</div>
      <div id="progressBarBg"><div id="progressBarFill"></div></div>
      <div id="progressDetail">0 / 0 拠点完了</div>
    </div>

    <script>
      google.script.run.withSuccessHandler(function(years) {
        const select = document.getElementById('yearSelect');
        select.innerHTML = '<option value="">▼ 年度を選択</option>';
        if(years.length === 0) {
          select.innerHTML = '<option value="">有効な年度データがありません</option>';
          return;
        }
        years.forEach(function(year) {
          select.innerHTML += `<option value="${year}">${year}年度</option>`;
        });
      }).getAvailableYears();

      function loadLocations() {
        const yearVal = document.getElementById('yearSelect').value;
        const termVal = document.getElementById('termSelect').value;
        const listDiv = document.getElementById('locationList');
        const submitBtn = document.getElementById('submitBtn');
        const selectionButtons = document.getElementById('selectionButtons');
        
        if(!yearVal || !termVal) {
          listDiv.innerHTML = '<p style="color: #888; font-size: 12px; margin: 0;">年度と期間を選択してください。</p>';
          submitBtn.disabled = true;
          selectionButtons.style.display = 'none';
          return;
        }

        listDiv.innerHTML = '拠点データを読込中...';
        submitBtn.disabled = true;
        selectionButtons.style.display = 'none';

        google.script.run.withSuccessHandler(function(locations) {
          listDiv.innerHTML = '';
          if(locations.length === 0) {
            listDiv.innerHTML = '<p style="color: red; font-size: 12px;">対象となる拠点がありません。</p>';
            return;
          }

          selectionButtons.style.display = 'block';

          locations.forEach(function(loc, index) {
            let isChecked = loc.isCreated ? '' : 'checked';
            let badge = loc.isCreated ? '<span class="badge-created">作成済</span>' : '';
            
            listDiv.innerHTML += `
              <div class="checkbox-item">
                <input type="checkbox" id="loc_${index}" value="${loc.name}" ${isChecked}>
                <label for="loc_${index}">${loc.name} ${badge}</label>
              </div>
            `;
          });
          submitBtn.disabled = false;
        }).getLocationListForUI({ year: yearVal, term: termVal });
      }

      function selectAll(checkStatus) {
        const checkboxes = document.querySelectorAll('#locationList input[type="checkbox"]');
        checkboxes.forEach(cb => {
          cb.checked = checkStatus;
        });
      }

      let pollInterval;

      function startBatchProcess() {
        const yearVal = document.getElementById('yearSelect').value;
        const termVal = document.getElementById('termSelect').value;
        const checkboxes = document.querySelectorAll('#locationList input[type="checkbox"]:checked');
        
        let targetLocations = [];
        checkboxes.forEach(cb => targetLocations.push(cb.value));

        if(targetLocations.length === 0) {
          alert('少なくとも1つの拠点を選択してください。');
          return;
        }

        document.getElementById('submitBtn').disabled = true;
        document.getElementById('submitBtn').innerText = "処理を予約中...";
        
        let payload = { year: yearVal, term: termVal, locations: targetLocations };
        
        google.script.run
          .withSuccessHandler(function(msg) {
            document.getElementById('submitBtn').style.display = 'none';
            document.getElementById('progressContainer').style.display = 'block';
            
            pollInterval = setInterval(checkProgress, 3000);
          })
          .withFailureHandler(function(error) {
            alert(`エラーが発生しました。\n${error.message}`);
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('submitBtn').innerText = "シフト表を裏側で作成する";
          })
          .startBackgroundBatch(payload);
      }
      
      function checkProgress() {
        google.script.run.withSuccessHandler(function(res) {
          if (res.status === "COMPLETED") {
            clearInterval(pollInterval);
            document.getElementById('progressStatus').innerText = "✨ すべて完了しました！";
            document.getElementById('progressStatus').style.color = "#34a853";
            document.getElementById('progressBarFill').style.width = "100%";
            document.getElementById('progressBarFill').style.backgroundColor = "#34a853";
            document.getElementById('progressDetail').innerText = "完了";
            
            setTimeout(() => {
              alert('選択された全拠点のシフト作成が完了しました！\n一番左に「🗂️シフト目次」シートが作成されています。');
              google.script.host.close();
            }, 800);
            
          } else if (res.status === "PROCESSING") {
            const pct = Math.floor((res.completed / res.total) * 100) || 0;
            document.getElementById('progressBarFill').style.width = pct + "%";
            document.getElementById('progressDetail').innerText = `${res.completed} / ${res.total} 拠点完了`;
            
            if (res.current) {
               document.getElementById('progressStatus').innerText = `現在処理中: ${res.current}`;
            } else {
               document.getElementById('progressStatus').innerText = `次の拠点を準備中...`;
            }
          }
        }).getBatchProgress();
      }
    </script>
  </body>
</html>
