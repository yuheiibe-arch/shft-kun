<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: "Meiryo UI", sans-serif; padding: 15px; color: #333; }
      .group { margin-bottom: 15px; }
      label { display: block; font-weight: bold; margin-bottom: 5px; }
      select, button { padding: 8px; font-size: 14px; width: 100%; box-sizing: border-box; }
      .radio-group, .checkbox-group { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 5px; }
      .radio-group label, .checkbox-group label { font-weight: normal; display: inline-flex; align-items: center; width: auto; cursor: pointer; }
      .btn-run { background-color: #4CAF50; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
      .btn-run:hover { background-color: #45a049; }
      .btn-run:disabled { background-color: #ccc; cursor: not-allowed; }
      .text-small { font-size: 12px; color: #666; cursor: pointer; text-decoration: underline; margin-right: 10px;}
      #loading { display: none; color: #d9534f; font-weight: bold; margin-top: 10px; text-align: center; }
    </style>
  </head>
  <body>
    <div class="group">
      <label>対象年度</label>
      <select id="yearSelect" onchange="updateLocationList()"><option>読込中...</option></select>
    </div>
    
    <div class="group">
      <label>対象期間</label>
      <div class="radio-group">
        <label><input type="radio" name="term" value="上期" checked onchange="updateLocationList()"> 上期 (4月〜9月)</label>
        <label><input type="radio" name="term" value="下期" onchange="updateLocationList()"> 下期 (10月〜3月)</label>
      </div>
      <div style="font-size:11px; color:#888; margin-top:5px;">※常勤のシフトは自動で通年出力されます</div>
    </div>

    <div class="group">
      <label>出力モード</label>
      <div class="radio-group">
        <label><input type="radio" name="mode" value="area" checked onchange="toggleMode()"> エリア一括</label>
        <label><input type="radio" name="mode" value="single" onchange="toggleMode()"> 個別拠点</label>
      </div>
    </div>

    <div class="group" id="areaSelectGroup">
      <label>出力エリア</label>
      <div>
        <span class="text-small" onclick="toggleAreas(true)">全選択</span>
        <span class="text-small" onclick="toggleAreas(false)">全解除</span>
      </div>
      <div class="checkbox-group" id="areaContainer">
        </div>
    </div>

    <div class="group" id="singleSelectGroup" style="display: none;">
      <label>出力拠点</label>
      <select id="singleLocSelect">
        <option value="">読込中...</option>
      </select>
    </div>

    <button id="runBtn" class="btn-run" onclick="execute()" disabled>リストを出力する</button>
    <div id="loading">処理中です。しばらくお待ちください...</div>

    <script>
      google.script.run.withSuccessHandler(initUI).getBoshukunInitData();

      function initUI(data) {
        const yearSel = document.getElementById('yearSelect');
        yearSel.innerHTML = '';
        data.years.forEach(y => {
          const opt = document.createElement('option');
          opt.value = y; opt.textContent = y + '年度';
          if(y === data.latestYear) opt.selected = true;
          yearSel.appendChild(opt);
        });

        const areaCont = document.getElementById('areaContainer');
        areaCont.innerHTML = '';
        data.areas.forEach(area => {
          const lbl = document.createElement('label');
          lbl.innerHTML = `<input type="checkbox" name="areaChk" value="${area}" checked> ${area}`;
          areaCont.appendChild(lbl);
        });

        updateLocSelectUI(data.allLocs);
        document.getElementById('runBtn').disabled = false;
      }

      function updateLocSelectUI(locs) {
        const singleLocSelect = document.getElementById('singleLocSelect');
        singleLocSelect.innerHTML = '';
        locs.forEach(loc => {
          const opt = document.createElement('option');
          opt.value = loc;
          opt.textContent = loc;
          singleLocSelect.appendChild(opt);
        });
      }

      function updateLocationList() {
        const year = document.getElementById('yearSelect').value;
        if (!year || year === "読込中...") return;
        
        const term = document.querySelector('input[name="term"]:checked').value;
        const singleLocSelect = document.getElementById('singleLocSelect');
        singleLocSelect.innerHTML = '<option value="">リスト更新中...</option>';

        google.script.run
          .withSuccessHandler(updateLocSelectUI)
          .updateLocationListForUI(year, term);
      }

      function toggleAreas(isChecked) {
        const checkboxes = document.getElementsByName('areaChk');
        for (let i = 0; i < checkboxes.length; i++) {
          checkboxes[i].checked = isChecked;
        }
      }

      function toggleMode() {
        const mode = document.querySelector('input[name="mode"]:checked').value;
        if (mode === 'area') {
          document.getElementById('areaSelectGroup').style.display = 'block';
          document.getElementById('singleSelectGroup').style.display = 'none';
        } else {
          document.getElementById('areaSelectGroup').style.display = 'none';
          document.getElementById('singleSelectGroup').style.display = 'block';
        }
      }

      function execute() {
        const year = document.getElementById('yearSelect').value;
        const term = document.querySelector('input[name="term"]:checked').value;
        const mode = document.querySelector('input[name="mode"]:checked').value;
        
        let areas = [];
        let singleLoc = "";
        
        if (mode === 'area') {
          const checkboxes = document.getElementsByName('areaChk');
          for (let i = 0; i < checkboxes.length; i++) {
            if (checkboxes[i].checked) {
              areas.push(checkboxes[i].value);
            }
          }
          if (areas.length === 0) {
            alert('エリアを1つ以上選択してください。');
            return;
          }
        } else {
          singleLoc = document.getElementById('singleLocSelect').value;
          if (!singleLoc) {
            alert('拠点を選択してください。');
            return;
          }
        }

        console.log("送信データ:", {year, term, mode, areas, singleLoc}); // デバッグ用

        document.getElementById('runBtn').disabled = true;
        document.getElementById('loading').style.display = 'block';

        google.script.run
          .withSuccessHandler(() => {
            document.getElementById('loading').innerText = '完了しました！';
            setTimeout(() => google.script.host.close(), 1500);
          })
          .withFailureHandler(err => {
            alert('エラーが発生しました:\n' + err.message);
            document.getElementById('runBtn').disabled = false;
            document.getElementById('loading').style.display = 'none';
          })
          .executeBoshukunMain(year, term, mode, areas, singleLoc);
      }
    </script>
  </body>
</html>
